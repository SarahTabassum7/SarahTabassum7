<svg width="940" height="320" viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F5A0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .card { animation: borderPulse 3s ease-in-out infinite; }
    @keyframes borderPulse { 0%, 100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .ping { animation: ping 2s cubic-bezier(0,0,0.2,1) infinite; transform-origin: 860px 36px; }
    @keyframes ping { 0% { r: 5; opacity: 0.8; } 75%, 100% { r: 15; opacity: 0; } }
    .fade1 { opacity: 0; animation: fadeIn 0.6s ease-out 0s forwards; }
    .fade2 { opacity: 0; animation: fadeIn 0.6s ease-out 0.15s forwards; }
    .fade3 { opacity: 0; animation: fadeIn 0.6s ease-out 0.3s forwards; }
    .fade4 { opacity: 0; animation: fadeIn 0.6s ease-out 0.45s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>

  <rect class="card" x="10.5" y="10.5" width="919" height="290" rx="16" fill="#0D1117" stroke="#00F5A0" stroke-width="1.5" filter="url(#glow)"/>

  <g class="fade4">
    <circle class="ping" cx="860" cy="36" r="5" fill="#00F5A0"/>
    <circle cx="860" cy="36" r="5" fill="#00F5A0"/>
    <text x="872" y="41" font-size="12" fill="#8b949e">Available</text>
  </g>

  <g class="fade1">
    <text x="48" y="70" font-size="34" font-weight="700" fill="#f0f6fc">Sarah Tabassum</text>
    <text x="48" y="98" font-size="16" fill="#00F5A0">Business Analyst &#160;&#183;&#160; AI-Enabled Systems &#160;&#183;&#160; SQL &#183; Power BI &#183; Python</text>
    <rect class="cursor" x="666" y="86" width="2" height="16" fill="#00F5A0"/>
  </g>

  <g class="fade2">
    <line x1="48" y1="118" x2="892" y2="118" stroke="#30363d" stroke-width="1"/>
    <text x="48" y="150" font-size="14" fill="#c9d1d9">
      <tspan x="48" dy="0">Financial Business Analyst at RAZR Capital LLC, contributing BA and financial</tspan>
      <tspan x="48" dy="22">analysis to SportsPulse, a live AI-powered sports-league SaaS platform.</tspan>
    </text>
  </g>

  <g class="fade3" font-size="13" fill="#c9d1d9">
    <rect x="48" y="196" width="172" height="34" rx="17" fill="#161B22" stroke="#30363d"/>
    <text x="134" y="217" text-anchor="middle">6+ Years Experience</text>

    <rect x="232" y="196" width="172" height="34" rx="17" fill="#161B22" stroke="#30363d"/>
    <text x="318" y="217" text-anchor="middle">Business Statistics</text>

    <rect x="416" y="196" width="172" height="34" rx="17" fill="#161B22" stroke="#30363d"/>
    <text x="502" y="217" text-anchor="middle">Financial Analytics</text>

    <rect x="600" y="196" width="158" height="34" rx="17" fill="#161B22" stroke="#30363d"/>
    <text x="679" y="217" text-anchor="middle">Product Analytics</text>

    <rect x="770" y="196" width="81" height="34" rx="17" fill="#161B22" stroke="#30363d"/>
    <text x="810" y="217" text-anchor="middle">Data/BI</text>
  </g>

  <text class="fade3" x="48" y="264" font-size="12" fill="#8b949e">Open to new opportunities in the fields above</text>
</svg>
